name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: sqlite:///${{ github.workspace }}/ci.db
      APP_TIMEZONE: UTC
      PASSWORD_PEPPER: ci-password-pepper-not-for-production
      APP_SECRET_KEY: ci-app-secret-not-for-production
      SESSION_TTL_DAYS: 1
      APP_CORS_ORIGINS: http://localhost:5173
      APP_CORS_METHODS: GET,POST,PUT,PATCH,DELETE,OPTIONS
      APP_CORS_HEADERS: Authorization,Content-Type
      SCHEDULER_TRIGGER_WORKERS: 1
      SCHEDULER_RUN_WORKERS: 1
      SCHEDULE_JOB_MAX_INSTANCES: 1
      SCHEDULE_MISFIRE_GRACE_SECONDS: 60
      SCHEDULE_STALE_RUNNING_MINUTES: 60
      LOG_LEVEL: INFO
      SOURCE_DB_CONNECT_TIMEOUT_SECONDS: 2
      SOURCE_DB_QUERY_TIMEOUT_SECONDS: 10
      PREVIEW_SQL_LIMIT: 10
      ALLOW_UNSAFE_SQL: "false"
      REDSHIFT_SSL: "true"
      REDSHIFT_SSLMODE: verify-full
      GOOGLE_SERVICE_ACCOUNT_FILE: credentials/Sheet_Service.json
      RUN_EMBEDDED_SCHEDULER: "false"
      SQL_ASSISTANT_PROVIDER: heuristic
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m alembic upgrade head
      - run: python -m pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: UI
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: UI/package-lock.json
      - run: npm ci
      - run: npm run build

  containers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cp .env.example .env
      - run: docker compose config
