name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: sqlite:///${{ github.workspace }}/ci.db
      APP_TIMEZONE: UTC
      PASSWORD_PEPPER: ci-password-pepper-not-for-production
      APP_SECRET_KEY: ci-app-secret-not-for-production
      SESSION_TTL_DAYS: 1
      APP_CORS_ORIGINS: http://localhost:5173
      APP_CORS_METHODS: GET,POST,PUT,PATCH,DELETE,OPTIONS
      APP_CORS_HEADERS: Authorization,Content-Type
      SCHEDULER_TRIGGER_WORKERS: 1
      SCHEDULER_RUN_WORKERS: 1
      SCHEDULE_JOB_MAX_INSTANCES: 1
      SCHEDULE_MISFIRE_GRACE_SECONDS: 60
      SCHEDULE_STALE_RUNNING_MINUTES: 60
      LOG_LEVEL: INFO
      SOURCE_DB_CONNECT_TIMEOUT_SECONDS: 2
      SOURCE_DB_QUERY_TIMEOUT_SECONDS: 10
      PREVIEW_SQL_LIMIT: 10
      ALLOW_UNSAFE_SQL: "false"
      REDSHIFT_SSL: "true"
      REDSHIFT_SSLMODE: verify-full
      GOOGLE_SERVICE_ACCOUNT_FILE: credentials/Sheet_Service.json
      RUN_EMBEDDED_SCHEDULER: "false"
      SQL_ASSISTANT_PROVIDER: heuristic
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m alembic upgrade head
      - run: python -m pytest -q
      - name: Guardrail eval (must block every attack)
        run: python -m eval.run_eval guardrails && python -c "import json,sys; r=json.load(open('eval/results/guardrails.json')); ok=all(not v['leaked'] for c in r['categories'].values() for v in c.values()) and all(not v['wrongly_rejected'] for v in r['false_positives'].values()); sys.exit(0 if ok else 1)"

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: UI
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: UI/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build

  integration:
    # Full Docker stack with seeded PostgreSQL + MySQL sources; no LLM key needed.
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Configure .env for CI
        run: |
          cp .env.example .env
          sed -i "s|^PASSWORD_PEPPER=.*|PASSWORD_PEPPER=$(openssl rand -hex 24)|" .env
          sed -i "s|^APP_SECRET_KEY=.*|APP_SECRET_KEY=$(openssl rand -hex 24)|" .env
          sed -i "s|^# DEMO_MYSQL_ADMIN_URL=|DEMO_MYSQL_ADMIN_URL=|" .env
          sed -i "s|^SQL_ASSISTANT_PROVIDER=.*|SQL_ASSISTANT_PROVIDER=heuristic|" .env
          chmod 777 output eval/results  # containers run as a non-root user
      - run: docker compose config --quiet
      - name: Start stack
        run: |
          docker compose --profile mysql up -d --build
          for i in $(seq 1 90); do curl -fsS http://localhost:8001/health/ready && break; sleep 3; done
          curl -fsS http://localhost:8001/health/ready
      - name: Live read-only role refuses every write/DDL attack
        run: |
          for c in "Demo retail (PostgreSQL)" "Demo retail (MySQL)"; do
            docker compose exec -T api python -m eval.run_eval readonly --connection "$c"
          done
          python3 -c "import json,glob,sys; r=[json.load(open(f)) for f in glob.glob('eval/results/readonly-*.json')]; sys.exit(0 if len(r)==2 and all(not x['executed'] for x in r) else 1)"
      - name: ETL end-to-end (scheduler queue, worker, incremental checkpoints, retries, timeouts)
        run: docker compose exec -T api python -m scripts.e2e_check
      - name: Logs on failure
        if: failure()
        run: docker compose --profile mysql logs --tail 200
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: integration-results
          path: eval/results/
